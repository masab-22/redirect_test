<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
    color: #1d1d1f;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 380px; }
  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 4px solid #d0d0d5;
    border-top-color: #007aff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: #6e6e73; margin-bottom: 20px; }
  a.manual-link {
    display: inline-block;
    padding: 10px 20px;
    background: #007aff;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="box">
  <div class="spinner"></div>
  <h1>Redirecting you...</h1>
  <p>Please wait while we take you to the right place.</p>
  <a class="manual-link" id="manualLink" href="#">Continue manually</a>
</div>

<script>
  // ====== CONFIGURE YOUR LINKS HERE ======
const APP_STORE_URL = "https://apps.apple.com/us/app/faysal-digibank/id1459836486";
const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.avanza.ambitwizfbl";
const WEB_APP_URL = "https://albaraka.com/en/";

  function getDeviceOS() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      return "ios";
    }
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints && navigator.maxTouchPoints > 1) {
      return "ios"; // iPadOS reporting as Mac
    }
    if (/android/i.test(ua)) {
      return "android";
    }
    return "other";
  }

  const os = getDeviceOS();
  let targetUrl;

  if (os === "ios") {
    targetUrl = APP_STORE_URL;
  } else if (os === "android") {
    targetUrl = PLAY_STORE_URL;
  } else {
    targetUrl = WEB_APP_URL;
  }

  // Set manual fallback link right away
  document.getElementById("manualLink").href = targetUrl;

  window.location.replace(targetUrl);
</script>

</body>
</html>
